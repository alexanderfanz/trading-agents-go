name: Auto Release (Instant)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Essential: Semantic Release needs full history to calculate correct versions

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true # We only want to install the binary; semantic-release will run it

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm dlx \
            --package=semantic-release \
            --package=@semantic-release/commit-analyzer \
            --package=@semantic-release/release-notes-generator \
            --package=@semantic-release/exec \
            --package=@semantic-release/github \
            semantic-release
