# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tradingagents
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.buildDate={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

changelog:
  disable: true # Let semantic-release handle the changelog/release notes generation instead
